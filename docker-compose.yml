version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: technest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: technest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: technest-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "file:./dev.db" # or postgresql://postgres:postgrespassword@postgres:5432/technest?schema=public
      JWT_SECRET: "technest_super_secret_jwt_access_token_key_2026_xYz"
      JWT_REFRESH_SECRET: "technest_super_secret_jwt_refresh_token_key_2026_aBc"
      CLIENT_URL: "http://localhost:3000"
      BASE_URL: "http://localhost:5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: technest-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
